[project]
name = "voc-data"
version = "0.1.0"
description = "Serving store schema, scope filter and migrations shared by the VoC services"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voc_data"]
