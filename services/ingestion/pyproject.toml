[project]
name = "ingestion"
version = "0.1.0"
description = "Ingestion task: pulls, masks and matches source data, then starts the Account Scoring Agent"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35",
    "httpx2>=0.1",
    "mcp>=1.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "snowflake-connector-python>=3.12",
    "voc-data",
]

[tool.uv.sources]
voc-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
