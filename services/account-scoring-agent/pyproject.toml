[project]
name = "account-scoring-agent"
version = "0.1.0"
description = "Account Scoring Agent: LangGraph on Amazon Bedrock AgentCore Runtime"
requires-python = ">=3.13"
dependencies = [
    "bedrock-agentcore>=1.0",
    "jinja2>=3.1",
    "langchain-aws>=0.2",
    "langgraph>=0.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "voc-data",
]

[tool.uv.sources]
voc-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/account_scoring_agent"]
