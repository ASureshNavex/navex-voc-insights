[project]
name = "notifications"
version = "0.1.0"
description = "Notification task: change-of-status alerts and digests"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35",
    "jinja2>=3.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "voc-data",
]

[tool.uv.sources]
voc-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifier"]
