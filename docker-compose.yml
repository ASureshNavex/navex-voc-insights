# Local PostgreSQL only. Hosted environments use the NAVEX-provisioned RDS instance.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: voc
      POSTGRES_PASSWORD: voc
      POSTGRES_DB: voc
    ports:
      - "5432:5432"
    volumes:
      - voc-pgdata:/var/lib/postgresql/data

volumes:
  voc-pgdata:
